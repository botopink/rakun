# Per-platform CI for rakun.
#
# Bootstrap path: check out this lib + botopink-lang, place this lib under
# `botopink-lang/repository/rakun/` so the multi-root resolver finds it
# without extra config, then run the library test runner from the
# botopink-lang checkout with no `--lib`: the runner discovers every project
# under `repository/` — the 25 modules, the 8 starters and the 3 examples of
# this workspace (each on the target its manifest declares) — so no member is
# outside the gate (gate-j; the pre-commit hook runs the same members).
#
# The matrix is the manifests' target set: rakun is erlang-only (decision
# 113), so there is one target and three runners, every row hard. There is no
# `commonJS` row (no member declares it) and no `beam` row (`botopink test`
# cannot run beam — a row that prints "skipped" measures nothing). The
# windows row installs OTP through `erlef/setup-beam`, as botopink-lang's does.
#
# `BOTOPINK_LANG_REF` (repo variable, default `feat`) lets the lib pin a
# specific botopink-lang SHA during a compiler-version dance.
name: test

on:
  push:
    branches: [feat, master, main]
  pull_request:
    branches: [feat, master, main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  LIB_NAME: rakun
  BOTOPINK_LANG_REPO: botopink/botopink-lang

jobs:
  test:
    name: ${{ matrix.runner }} · ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: erlang }
          - { runner: macos-14,     target: erlang }
          - { runner: windows-2022, target: erlang }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout this lib
        uses: actions/checkout@v5
        with:
          path: self

      - name: Checkout botopink-lang
        uses: actions/checkout@v5
        with:
          repository: ${{ env.BOTOPINK_LANG_REPO }}
          ref: ${{ vars.BOTOPINK_LANG_REF || 'feat' }}
          path: botopink-lang

      - name: Place lib under botopink-lang/repository/${{ env.LIB_NAME }}/
        shell: bash
        run: |
          mkdir -p botopink-lang/repository
          # rsync may not be available on the windows runner — fall back to
          # cp -R; both produce a real tree (no symlink follow-through quirks).
          if command -v rsync >/dev/null 2>&1; then
            rsync -a --delete self/ "botopink-lang/repository/${LIB_NAME}/"
          else
            rm -rf "botopink-lang/repository/${LIB_NAME}"
            cp -R self "botopink-lang/repository/${LIB_NAME}"
          fi

      # OTP 28 everywhere: the comptime runtime writes JSON via `json:encode/1`
      # (OTP 27+), and the codegen fixtures need OTP 28's reading of the
      # `abs/1` BIF-shadow diagnostic (a warning, not an error).
      - name: Install Erlang/OTP (linux, windows)
        if: matrix.runner != 'macos-14'
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'

      - name: Install Erlang/OTP (macos)
        if: matrix.runner == 'macos-14'
        run: brew install erlang

      # H7 (v0.beta.19) — release fast path. Opt-in via the lib's
      # `BOTOPINK_USE_RELEASE_FASTPATH` repo variable. Set to `true` after
      # botopink-lang has published at least one tagged release; until then,
      # the source path below is the default.
      - name: Install botopink (release fast path)
        if: ${{ vars.BOTOPINK_USE_RELEASE_FASTPATH == 'true' }}
        shell: bash
        run: |
          if [ "${{ matrix.runner }}" = "windows-2022" ]; then
            powershell -ExecutionPolicy Bypass -Command "iwr https://botopink.dev/install.ps1 -UseBasicParsing | iex"
            echo "$USERPROFILE\\.bpmp\\bin" >> $GITHUB_PATH
          else
            curl --proto '=https' --tlsv1.2 -sSfL https://botopink.dev/install.sh | sh
            echo "$HOME/.bpmp/bin" >> $GITHUB_PATH
          fi

      - name: Install Zig (source build path)
        if: ${{ vars.BOTOPINK_USE_RELEASE_FASTPATH != 'true' }}
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Print build identity
        shell: bash
        run: |
          echo "lib:     ${LIB_NAME}"
          echo "target:  ${{ matrix.target }}"
          echo "runner:  ${{ matrix.runner }}"
          echo "fastpath: ${{ vars.BOTOPINK_USE_RELEASE_FASTPATH }}"
          echo "ref:     ${{ vars.BOTOPINK_LANG_REF || 'feat' }}"
          erl -noshell -eval 'io:format("otp: ~s~n", [erlang:system_info(otp_release)]), halt().'

      - name: zig build install (source build path)
        if: ${{ vars.BOTOPINK_USE_RELEASE_FASTPATH != 'true' }}
        working-directory: botopink-lang
        run: zig build install

      # The compiler the cells and the fixture-build tests of `rakun-client`
      # run (`BOTOPINK_BIN`): the one `zig build install` just produced, or the
      # released one on the fast path.
      - name: Export BOTOPINK_BIN
        working-directory: botopink-lang
        shell: bash
        run: |
          if [ "${{ vars.BOTOPINK_USE_RELEASE_FASTPATH }}" = "true" ]; then
            bin=$(command -v botopink)
          else
            bin="$(pwd)/zig-out/bin/botopink"
            [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          fi
          [ -x "$bin" ] || { echo "botopink binary not found at $bin"; exit 1; }
          echo "BOTOPINK_BIN=$bin" >> "$GITHUB_ENV"

      # Every member and example of the workspace, one runner call: no `--lib`,
      # so the runner's own discovery from `repository/` lists them all (a
      # hand-written loop would be a second list to keep in step). `--strict`:
      # a cell the runner cannot run is a failure, never a skip. The runner
      # binary itself, not `scripts/test-libs.sh`: the cells are judged by
      # their manifests, not by a ledger.
      - name: botopink-lib-test --target ${{ matrix.target }} — every member and example (source)
        if: ${{ vars.BOTOPINK_USE_RELEASE_FASTPATH != 'true' }}
        working-directory: botopink-lang
        shell: bash
        run: zig-out/bin/botopink-lib-test --target "${{ matrix.target }}" --strict --bin "$BOTOPINK_BIN"

      - name: botopink-lib-test --target ${{ matrix.target }} — every member and example (fast path)
        if: ${{ vars.BOTOPINK_USE_RELEASE_FASTPATH == 'true' }}
        working-directory: botopink-lang
        shell: bash
        run: botopink-lib-test --target "${{ matrix.target }}" --strict --bin "$BOTOPINK_BIN"

      # Every examples/*/ with a botopink.json builds (runExamplesGate, the same
      # stage as the pre-commit hook), on every row: an example that does not
      # build fails the job.
      - name: Examples build
        working-directory: botopink-lang/repository/${{ env.LIB_NAME }}
        shell: bash
        run: |
          source scripts/git-hooks/lib/runner-standalone.sh
          bin=$(locateBotopink) || { echo "botopink binary not found"; exit 1; }
          runExamplesGate "$bin"
